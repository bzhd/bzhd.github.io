<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>身高体重查询</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding:
                max(16px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 26px;
            line-height: 1.3;
        }

        .query-box {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: end;
            margin-bottom: 24px;
        }

        .form-item {
            flex: 1 1 220px;
            min-width: 0;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-item input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-item input:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
        }

        button {
            height: 46px;
            padding: 0 30px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: #0958d9;
        }

        button:active {
            transform: translateY(1px);
        }

        .message {
            margin: 14px 0;
            font-size: 15px;
            line-height: 1.5;
            font-weight: bold;
        }

        #result {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            margin-top: 12px;
            background: #fff;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px 8px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #f0f2f5;
        }

        .success {
            color: #00875a;
        }

        .error {
            color: #d4380d;
        }

        .detail {
            margin-top: 5px;
            font-size: 13px;
            color: #666;
        }

        /* 手机端 */
        @media (max-width: 600px) {
            body {
                padding:
                    max(10px, env(safe-area-inset-top))
                    max(8px, env(safe-area-inset-right))
                    max(16px, env(safe-area-inset-bottom))
                    max(8px, env(safe-area-inset-left));
                background: #fff;
            }

            .container {
                padding: 14px 12px 18px;
                border-radius: 0;
                box-shadow: none;
            }

            h1 {
                margin-bottom: 18px;
                font-size: 22px;
            }

            .query-box {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px 10px;
                margin-bottom: 18px;
            }

            .form-item {
                min-width: 0;
            }

            .form-item label {
                margin-bottom: 6px;
                font-size: 14px;
            }

            .form-item input {
                height: 48px;
                padding: 0 10px;
                border-radius: 10px;
                font-size: 16px;
            }

            button {
                grid-column: 1 / -1;
                width: 100%;
                height: 48px;
                margin-top: 2px;
                border-radius: 10px;
                font-size: 17px;
            }

            .message {
                margin: 12px 0 8px;
                font-size: 14px;
            }

            /* 手机端把表格改为结果卡片，避免横向拖动 */
            #result table,
            #result thead,
            #result tbody,
            #result tr,
            #result th,
            #result td {
                display: block;
            }

            #result table {
                min-width: 0;
                margin-top: 10px;
                border: 0;
            }

            #result thead {
                display: none;
            }

            #result tbody {
                display: grid;
                gap: 12px;
            }

            #result tr {
                padding: 12px;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                background: #fff;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            }

            #result td {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 14px;
                padding: 8px 0;
                border: 0;
                border-bottom: 1px solid #f0f0f0;
                text-align: right;
                white-space: normal;
                word-break: break-word;
                font-size: 14px;
            }

            #result td:last-child {
                border-bottom: 0;
            }

            #result td::before {
                flex: 0 0 auto;
                color: #666;
                font-weight: 600;
                text-align: left;
            }

            #result td:nth-child(1)::before { content: "名称"; }
            #result td:nth-child(2)::before { content: "身高(m)"; }
            #result td:nth-child(3)::before { content: "体重(kg)"; }
			#result td:nth-child(4)::before { content: "孵蛋时长(分钟)"; }
			#result td:nth-child(5)::before { content: "周内风场(分钟)"; }
			#result td:nth-child(6)::before { content: "周末风场(分钟)"; }

            #result td:first-child {
                padding-top: 0;
                font-size: 16px;
                font-weight: 700;
                color: #1677ff;
            }

            #result td:last-child {
                padding-bottom: 0;
            }
        }

        /* 极窄屏：输入框纵向排列 */
        @media (max-width: 360px) {
            .query-box {
                grid-template-columns: 1fr;
            }

            button {
                grid-column: auto;
            }
        }
    </style>
</head>

<div class="container">

    <h1>身高体重查询</h1>

    <div class="query-box">

        <div class="form-item">

                id="height"

            >
        </div>

        <div class="form-item">
            <label for="weight">体重(kg)</label>
            <input
                id="weight"
                type="number"

            >

    <div id="message" class="message"></div>

</div>

/*
 * =====================================================
 * 查询函数
 * =====================================================
 */

function queryData() {

    const heightInput =
        document.getElementById("height").value.trim();

    const weightInput =
        document.getElementById("weight").value.trim();

    const height =
        heightInput === "" ? 32 : Number(heightInput)*100;

    const weight =
        weightInput === "" ? 4510 : Number(weightInput)*1000;

    const message =
        document.getElementById("message");

    const result =
        document.getElementById("result");


    /*
     * 检查输入
     */

    if (
        !Number.isFinite(height) ||
        !Number.isFinite(weight)
    ) {

        message.className = "message error";
        message.textContent =
            "请输入有效的身高和体重。";

        result.innerHTML = "";

        return;
    }


    /*
     * =================================================
     * 对应 Excel FILTER 条件
     * =================================================
     */

    const matches = data
        .map(item => {

            const {
                name,
                lowheight,
                highheight,
                lowweight,
                highweight
            } = item;


            /*
             * 防止 highheight == lowheight
             * 相当于 Excel 中的 IFERROR
             */

            const denominator =
                highheight - lowheight;

            if (denominator === 0) {
                return null;
            }


            /*
             * 第一个线性值
             *
             * D +
             * (H8 - 0.5 - B)
             * ×
             * (E - D)
             * /
             * (C - B)
             */

            const lineMinus =
                lowweight +
                (height - 0.5 - lowheight) *
                (highweight - lowweight) /
                denominator - 
				(highweight - lowweight) * 0.02;


            /*
             * 第二个线性值
             *
             * D +
             * (H8 + 0.5 - B)
             * ×
             * (E - D)
             * /
             * (C - B)
             */

            const linePlus =
                lowweight +
                (height + 0.5 - lowheight) *
                (highweight - lowweight) /
                denominator + 
				(highweight - lowweight) * 0.02;


            /*
             * Excel：
             *
             * (H8 > B)
             * *
             * (H8 < C)
             * *
             * (J8 > D)
             * *
             * (J8 < E)
             * *
             * (J8 > lineMinus)
             * *
             * (J8 < linePlus)
             */

            const matched =
                height >= lowheight &&
                height <= highheight &&
                weight >= lowweight &&
                weight <= highweight &&
                weight >= lineMinus &&
                weight <= linePlus;


            if (!matched) {
                return null;
            }


            return {
                ...item,
                lineMinus,
                linePlus
            };

        })
        .filter(Boolean);


    /*
     * =================================================
     * 显示结果
     * =================================================
     */

    if (matches.length === 0) {

        message.className = "message error";

        message.textContent =
            "无匹配结果";

        result.innerHTML = "";

        return;
    }


    message.className = "message success";

    message.textContent =
        `共找到 ${matches.length} 条匹配结果`;


    let html = `

        <table>

            <thead>

                <tr>
                    <th>名称</th>
                    <th>身高</th>
                    <th>体重</th>
					<th>孵蛋时长(分钟)</th>
					<th>周内风场(分钟)</th>
					<th>周末风场(分钟)</th>
                </tr>

            </thead>

            <tbody>
    `;


    matches.forEach(item => {

        html += `

            <tr>

                <td>${item.name}</td>

                <td>${item.lowheight/100}~${item.highheight/100}</td>

                <td>${item.lowweight/1000}~${item.highweight/1000}</td>
				
				<td>${item.hatchdata}</td>
				
				<td>${item.hatchdata/6}</td>
				
				<td>${item.hatchdata/30}</td>

            </tr>
        `;

    });


    html += `

            </tbody>

        </table>
    `;


    result.innerHTML = html;

}

        if (event.key === "Enter") {
            queryData();
