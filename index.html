/*
 * =====================================================
 * 查询函数
 * =====================================================
 */

function queryData() {

    const height =
        Number(document.getElementById("height").value);

    const weight =
        Number(document.getElementById("weight").value);

    const message =
        document.getElementById("message");

    const result =
        document.getElementById("result");


    /*
     * 检查输入
     */

    if (
        !Number.isFinite(height) ||
        !Number.isFinite(weight)
    ) {

        message.className = "message error";
        message.textContent =
            "请输入有效的身高和体重。";

        result.innerHTML = "";

        return;
    }


    /*
     * =================================================
     * 对应 Excel FILTER 条件
     * =================================================
     */

    const matches = data
        .map(item => {

            const {
                name,
                lowheight,
                highheight,
                lowweight,
                highweight
            } = item;


            /*
             * 防止 highheight == lowheight
             * 相当于 Excel 中的 IFERROR
             */

            const denominator =
                highheight - lowheight;

            if (denominator === 0) {
                return null;
            }


            /*
             * 第一个线性值
             *
             * D +
             * (H8 - 0.5 - B)
             * ×
             * (E - D)
             * /
             * (C - B)
             */

            const lineMinus =
                lowweight +
                (height - 0.5 - lowheight) *
                (highweight - lowweight) /
                denominator;


            /*
             * 第二个线性值
             *
             * D +
             * (H8 + 0.5 - B)
             * ×
             * (E - D)
             * /
             * (C - B)
             */

            const linePlus =
                lowweight +
                (height + 0.5 - lowheight) *
                (highweight - lowweight) /
                denominator;


            /*
             * Excel：
             *
             * (H8 > B)
             * *
             * (H8 < C)
             * *
             * (J8 > D)
             * *
             * (J8 < E)
             * *
             * (J8 > lineMinus)
             * *
             * (J8 > linePlus)
             */

            const matched =
                height > lowheight &&
                height < highheight &&
                weight > lowweight &&
                weight < highweight &&
                weight > lineMinus &&
                weight > linePlus;


            if (!matched) {
                return null;
            }


            return {
                ...item,
                lineMinus,
                linePlus
            };

        })
        .filter(Boolean);


    /*
     * =================================================
     * 显示结果
     * =================================================
     */

    if (matches.length === 0) {

        message.className = "message error";

        message.textContent =
            "无匹配结果";

        result.innerHTML = "";

        return;
    }


    message.className = "message success";

    message.textContent =
        `共找到 ${matches.length} 条匹配结果`;


    let html = `

        <table>

            <thead>

                <tr>
                    <th>名称</th>
                    <th>最低身高</th>
                    <th>最高身高</th>
                    <th>最低体重</th>
                    <th>最高体重</th>
                    <th>H-0.5线性值</th>
                    <th>H+0.5线性值</th>
                </tr>

            </thead>

            <tbody>
    `;


    matches.forEach(item => {

        html += `

            <tr>

                <td>${item.name}</td>

                <td>${item.lowheight}</td>

                <td>${item.highheight}</td>

                <td>${item.lowweight}</td>

                <td>${item.highweight}</td>

                <td>
                    ${item.lineMinus.toFixed(2)}
                </td>

                <td>
                    ${item.linePlus.toFixed(2)}
                </td>

            </tr>
        `;

    });


    html += `

            </tbody>

        </table>
    `;


    result.innerHTML = html;

}


/*
 * 回车直接查询
 */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            queryData();
        }

    }
);


/*
 * 页面打开时自动查询默认值
 */

queryData();
